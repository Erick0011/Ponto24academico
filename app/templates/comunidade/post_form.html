{% extends "base.html" %}
{% block title %}Nova publicação — Comunidade — Ponto 24 Académico{% endblock %}

{% block content %}
<div class="container-xl py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="fw-800 mb-0">Nova publicação</h4>
        <a href="{{ url_for('comunidade.feed') }}" class="btn btn-light fw-600">
          <i class="bi bi-arrow-left me-2"></i>Voltar
        </a>
      </div>

      <div class="p24-card">
        <form method="post" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          {% include "partials/honeypot.html" %}

          <div class="mb-3">
            <label class="form-label fw-600">Tipo</label>
            <select name="tipo" class="form-select">
              {% for val, label in tipos %}
              <option value="{{ val }}" {% if val == 'discussao' %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-600">Título</label>
            <input type="text" name="titulo" class="form-control" maxlength="200" required
                   placeholder="Sobre o que é a tua publicação?">
          </div>

          <div class="mb-3">
            <label class="form-label fw-600">Conteúdo</label>
            <textarea name="corpo" class="form-control" rows="6" required
                      placeholder="Escreve os detalhes aqui..."></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-600">Fotos <span class="text-muted fw-400">(opcional, até 6)</span></label>
            <input type="file" name="imagens" class="form-control" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
          </div>

          <button type="submit" class="btn btn-primary fw-700">
            <i class="bi bi-send me-2"></i>Publicar
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
