{% extends "base.html" %}
{% block title %}Página não encontrada — Ponto 24 Académico{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:75vh;padding:3rem 1rem">
  <div class="text-center" style="max-width:480px">

    <div class="mb-4 position-relative d-inline-block">
      <span class="fw-800 d-block lh-1"
            style="font-size:7rem;color:#e9ecef;letter-spacing:-.02em;user-select:none">404</span>
      <i class="bi bi-search position-absolute"
         style="font-size:2.8rem;color:var(--p24-blue);top:50%;left:50%;transform:translate(-50%,-50%)"></i>
    </div>

    <h2 class="fw-800 mb-2">Página não encontrada</h2>
    <p class="text-muted mb-4">
      O endereço que procuras não existe ou foi movido.<br>
      Verifica o link ou volta à página inicial.
    </p>

    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary fw-700 px-4">
        <i class="bi bi-house me-2"></i>Página inicial
      </a>
      <a href="{{ url_for('materiais.listar') }}" class="btn btn-outline-secondary fw-600 px-4">
        <i class="bi bi-grid me-2"></i>Explorar materiais
      </a>
    </div>

  </div>
</div>
{% endblock %}
