{% extends "base.html" %}
{% block title %}Entrar — Ponto 24 Académico{% endblock %}

{% block content %}
<div class="p24-auth-page">
  <div class="p24-auth-card">
    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="{{ url_for('main.index') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
        <div class="p24-logo-badge">P<span>24</span></div>
        <div class="p24-logo-text">
          <span class="fw-800">PONTO 24</span><br><small>ACADÉMICO</small>
        </div>
      </a>
      <h5 class="fw-800 mt-3 mb-1">Bem-vindo de volta!</h5>
      <p class="text-muted small">Entra na tua conta para continuar</p>
    </div>

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" name="email" class="form-control border-start-0 ps-0"
                 placeholder="exemplo@email.com" required />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label d-flex justify-content-between">
          Palavra-passe
          <a href="#" class="text-orange small fw-600">Esqueceste?</a>
        </label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" name="password" id="pw" class="form-control border-start-0 ps-0"
                 placeholder="••••••••" required />
          <button type="button" class="input-group-text bg-white border-start-0"
                  onclick="togglePw()">
            <i class="bi bi-eye text-muted" id="pwIcon"></i>
          </button>
        </div>
      </div>
      <div class="mb-4 d-flex align-items-center justify-content-between">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="lembrar" id="lembrar">
          <label class="form-check-label small" for="lembrar">Lembrar-me</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-700 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
      Não tens conta?
      <a href="{{ url_for('auth.registar') }}" class="text-orange fw-700">Registar agora</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw() {
  const pw = document.getElementById('pw');
  const ic = document.getElementById('pwIcon');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  ic.className = pw.type === 'password' ? 'bi bi-eye text-muted' : 'bi bi-eye-slash text-muted';
}
</script>
{% endblock %}
