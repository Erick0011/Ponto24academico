{% extends "base.html" %}
{% block title %}Registar — Ponto 24 Académico{% endblock %}

{% block content %}
<div class="p24-auth-page">
  <div class="p24-auth-card" style="max-width:520px">
    <div class="text-center mb-4">
      <a href="{{ url_for('main.index') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
        <div class="p24-logo-badge">P<span>24</span></div>
        <div class="p24-logo-text">
          <span class="fw-800">PONTO 24</span><br><small>ACADÉMICO</small>
        </div>
      </a>
      <h5 class="fw-800 mt-3 mb-1">Cria a tua conta</h5>
      <p class="text-muted small">Junta-te a milhares de estudantes angolanos</p>
    </div>

    <!-- Boas-vindas créditos -->
    <div class="alert border-0 mb-4 d-flex align-items-center gap-2"
         style="background:var(--p24-orange-lt);border-radius:var(--p24-radius)">
      <span style="font-size:1.5rem">🎁</span>
      <span class="small fw-600" style="color:var(--p24-orange)">
        Ganhas <strong>10 créditos</strong> de boas-vindas ao registares!
      </span>
    </div>

    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nome completo *</label>
          <input type="text" name="nome" class="form-control" placeholder="José Eduardo" required />
        </div>
        <div class="col-12">
          <label class="form-label">Email *</label>
          <input type="email" name="email" class="form-control" placeholder="exemplo@email.com" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Palavra-passe *</label>
          <input type="password" name="password" class="form-control" placeholder="Mín. 6 caracteres" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirmar *</label>
          <input type="password" name="confirmacao" class="form-control" placeholder="Repete a palavra-passe" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Instituição</label>
          <input type="text" name="instituicao" class="form-control" placeholder="Ex: Complexo Escolar 123" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Curso / Classe</label>
          <input type="text" name="curso" class="form-control" placeholder="Ex: 12ª Classe, Eng. Informática" />
        </div>
        <div class="col-12 mt-2">
          <button type="submit" class="btn btn-primary w-100 fw-700 py-2">
            <i class="bi bi-person-plus me-2"></i>Criar conta grátis
          </button>
        </div>
      </div>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
      Já tens conta?
      <a href="{{ url_for('auth.entrar') }}" class="text-orange fw-700">Entrar</a>
    </p>
  </div>
</div>
{% endblock %}
