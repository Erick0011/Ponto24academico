{% extends "base.html" %}
{% block title %}Recuperar palavra-passe — Ponto 24 Académico{% endblock %}

{% block content %}
<div class="p24-auth-page">
  <div class="p24-auth-card">
    <div class="text-center mb-4">
      <a href="{{ url_for('main.index') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
        <div class="p24-logo-badge">P<span>24</span></div>
        <div class="p24-logo-text">
          <span class="fw-800">PONTO 24</span><br><small>ACADÉMICO</small>
        </div>
      </a>
      <div class="mt-3 mb-1 d-inline-flex align-items-center justify-content-center rounded-circle"
           style="width:52px;height:52px;background:#fee2e2;margin:0 auto;display:block!important">
        <i class="bi bi-key-fill text-danger fs-4"></i>
      </div>
      <h5 class="fw-800 mt-2 mb-1">Esqueceste a palavra-passe?</h5>
      <p class="text-muted small">Indica o teu email e enviamos um link para redefinires.</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label class="form-label">Email da conta</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" name="email" class="form-control border-start-0 ps-0"
                 placeholder="exemplo@email.com" required autofocus />
        </div>
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-700 py-2">
        <i class="bi bi-send me-2"></i>Enviar link de recuperação
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
      Lembraste?
      <a href="{{ url_for('auth.entrar') }}" class="text-orange fw-700">Entrar</a>
    </p>
  </div>
</div>
{% endblock %}
